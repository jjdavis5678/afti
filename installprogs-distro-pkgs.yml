---
#
# Install programs from distro standard repos
#
- name: install some favorite programs
  hosts: all
  become: yes

  tasks:

    - name: include var files
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files: # Most specific to least specific:
            - "{{ ansible_facts['distribution_release'] }}-vars.yml" # e.g. Ubuntu 26
            - "{{ ansible_facts['distribution'] }}-vars.yml" # e.g. Ubuntu          
            - "{{ ansible_facts['os_family'] }}-vars.yml"  # e.g. Debian
            - "default-vars.yml"
      tags:
        - include

    - name: show neofetchpkg value
      ansible.builtin.debug:
        msg: "{{ neofetchpkg }}"
      tags:
        - debug        
    
    - name: install expect, zile # both have the same name across Debian and RedHat OS families
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - expect
        - zile

    - name: neofetch, Debian # "neowofetch" on Ubuntu 26, "neofetch" on other Debian OS, 
      ansible.builtin.apt:
        update_cache: yes
        name: "{{ neofetchpkg }}"
        state: latest
      when: ansible_facts['os_family'] == "Debian"

    - name: neofetch, Fedora # "fastfetch" replaced neofetch in Fedora.
      ansible.builtin.dnf:
        update_cache: yes
        name: "{{ neofetchpkg }}"
        state: present
      when: ansible_facts['os_family'] == "RedHat"
