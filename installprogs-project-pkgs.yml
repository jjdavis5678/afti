---
#
# Example of installing programs from project repos
#
- name: Install Postgresql on Ubuntu from the project repos
  hosts: dbservers
  become: yes

  tasks:

    - name: get the repo gpg key
      ansible.builtin.get_url:
        url: https://www.postgres.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/trusted.gpg.d/pgdg.key.asc
            
    - name: set up the project repo
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        architectures: arm64  # ansible_facts['architecture'] returns aarch64, but it has to be arm64 here instead
        signed_by: /etc/apt/trusted.gpg.d/pgdg.key.asc

    - name: now install postgresql
      ansible.builtin.apt:
        update_cache: yes
        name: postgresql
        state: present

    - name: enable and start postgresql
      ansible.builtin.systemd_service:
        name: postgresql
        state: started
        enabled: true
